# 一键启动：docker compose up -d --build
# 默认使用内置 Mock 模型（无需密钥即可体验）；如需真实大模型，复制 .env.example 为 .env 并填入 LLM_API_KEY。
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --port=19042 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ai_service_agent
      MYSQL_USER: csagent
      MYSQL_PASSWORD: csagentpwd
      MYSQL_ROOT_PASSWORD: rootpwd
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P19042 -ucsagent -pcsagentpwd || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${MYSQL_HOST_PORT:-19042}:19042"

  backend:
    build:
      context: ./backend
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: mysql
      APP_TIME_ZONE: Asia/Shanghai
      SERVER_PORT: 19040
      DATABASE_URL: jdbc:mysql://mysql:19042/ai_service_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      DATABASE_USERNAME: csagent
      DATABASE_PASSWORD: csagentpwd
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:19040/api/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    ports:
      - "${BACKEND_HOST_PORT:-19040}:19040"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_HOST: backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:19041/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "${FRONTEND_HOST_PORT:-19041}:19041"

volumes:
  mysqldata:
