# 一键启动：docker compose up -d --build
# 默认使用内置 Mock 模型（无需密钥即可体验）；如需真实大模型，复制 .env.example 为 .env 并填入 LLM_API_KEY。
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --port=19042 --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: ai_service_agent
      MYSQL_USER: ${DATABASE_USERNAME:-csagent}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD:-csagentpwd}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpwd}
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysqladmin ping -h 127.0.0.1 -P19042 -u$$MYSQL_USER || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-19042}:19042"

  backend:
    build:
      context: ./backend
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: mysql
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Shanghai}
      SERVER_PORT: 19040
      DATABASE_URL: ${DATABASE_URL:-jdbc:mysql://mysql:19042/ai_service_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-csagent}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-csagentpwd}
      APP_DEMO_ENABLED: ${APP_DEMO_ENABLED:-true}
      APP_TENANT_ID: ${APP_TENANT_ID:-demo}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://127.0.0.1:19041,http://localhost:19041}
      APP_SECURITY_RBAC_ENABLED: ${APP_SECURITY_RBAC_ENABLED:-true}
      APP_SECURITY_ANONYMOUS_CHAT: ${APP_SECURITY_ANONYMOUS_CHAT:-false}
      APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET:-csagent-dev-jwt-secret-change-me-in-prod!!}
      APP_SECURITY_JWT_EXPIRATION_MINUTES: ${APP_SECURITY_JWT_EXPIRATION_MINUTES:-480}
      APP_SECURITY_COOKIE_NAME: ${APP_SECURITY_COOKIE_NAME:-CSAGENT_AUTH}
      APP_SECURITY_COOKIE_SECURE: ${APP_SECURITY_COOKIE_SECURE:-false}
      APP_SECURITY_COOKIE_SAME_SITE: ${APP_SECURITY_COOKIE_SAME_SITE:-Strict}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
      LLM_MAX_TOOL_ROUNDS: ${LLM_MAX_TOOL_ROUNDS:-3}
      LLM_ALLOW_PRIVATE_BASE_URL: ${LLM_ALLOW_PRIVATE_BASE_URL:-false}
      BUSINESS_ADAPTER: ${BUSINESS_ADAPTER:-mock}
      BUSINESS_BASE_URL: ${BUSINESS_BASE_URL:-}
      BUSINESS_API_TOKEN: ${BUSINESS_API_TOKEN:-}
      BUSINESS_TIMEOUT_SECONDS: ${BUSINESS_TIMEOUT_SECONDS:-5}
      BUSINESS_MAX_RETRIES: ${BUSINESS_MAX_RETRIES:-1}
      SLA_URGENT_MINUTES: ${SLA_URGENT_MINUTES:-15}
      SLA_HIGH_MINUTES: ${SLA_HIGH_MINUTES:-60}
      SLA_MEDIUM_MINUTES: ${SLA_MEDIUM_MINUTES:-240}
      SLA_LOW_MINUTES: ${SLA_LOW_MINUTES:-480}
      SLA_WARNING_MINUTES: ${SLA_WARNING_MINUTES:-5}
      SLA_SCAN_INTERVAL_MS: ${SLA_SCAN_INTERVAL_MS:-30000}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:19040/api/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-19040}:19040"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_HOST: backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:19041/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_HOST_PORT:-19041}:19041"

volumes:
  mysqldata:
