# 一键启动：docker compose up -d --build
# 默认使用内置 Mock 模型（无需密钥即可体验）；如需真实大模型，复制 .env.example 为 .env 并填入 LLM_API_KEY。
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ai_service_agent
      MYSQL_USER: csagent
      MYSQL_PASSWORD: csagentpwd
      MYSQL_ROOT_PASSWORD: rootpwd
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -ucsagent -pcsagentpwd || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DATABASE_URL: jdbc:mysql://mysql:3306/ai_service_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      DATABASE_USERNAME: csagent
      DATABASE_PASSWORD: csagentpwd
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.3}
    ports:
      - "8081:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mysqldata:
