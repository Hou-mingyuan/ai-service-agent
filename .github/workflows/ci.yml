name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Verify (compile + test + package)
        run: mvn -B verify

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  docker-smoke:
    name: Docker Compose smoke (Mock LLM)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose
        run: docker compose config >/dev/null

      - name: Build and start stack
        env:
          LLM_PROVIDER: mock
          BACKEND_HOST_PORT: 18084
          FRONTEND_HOST_PORT: 18085
        run: |
          docker compose up -d --build
          echo "Waiting for MySQL + backend..."
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:18084/api/health" >/dev/null 2>&1; then
              echo "Backend healthy after ${i}s"
              break
            fi
            sleep 2
          done

      - name: Smoke probes (Hub Profile equivalent ports)
        run: |
          set -euo pipefail
          health="$(curl -sf "http://localhost:18084/api/health")"
          echo "$health" | grep -q '"llmProvider":"mock"'
          echo "$health" | grep -q '"status":"UP"'
          curl -sf -o /dev/null "http://localhost:18085/"
          echo "Docker smoke PASSED (mock LLM, 18084/18085)"

      - name: k6 read smoke (host port)
        run: |
          docker run --rm \
            -e BASE_URL=http://host.docker.internal:18084 \
            -e VUS=10 \
            -e DURATION=20s \
            -v "${{ github.workspace }}/performance:/scripts" \
            --add-host=host.docker.internal:host-gateway \
            grafana/k6:latest run /scripts/k6-smoke.js

      - name: k6 SSE chat soak (Mock LLM)
        run: |
          docker run --rm \
            -e BASE_URL=http://host.docker.internal:18084 \
            -e VUS=3 \
            -e DURATION=15s \
            -e THINK_TIME_SECONDS=1 \
            -v "${{ github.workspace }}/performance:/scripts" \
            --add-host=host.docker.internal:host-gateway \
            grafana/k6:latest run /scripts/k6-sse-chat-soak.js

      - name: Tear down
        if: always()
        run: docker compose down -v
