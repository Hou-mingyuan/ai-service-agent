name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Repository quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Secret and legacy endpoint scan
        run: node scripts/quality-gates.mjs

      - name: Whitespace and patch integrity
        run: git diff --check

  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Verify (compile + test + package)
        run: mvn -B verify

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, test and build
        run: npm run check

  docker-smoke:
    name: Docker Compose smoke (Mock LLM)
    runs-on: ubuntu-latest
    needs: [quality, backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js for acceptance smoke
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate compose
        run: docker compose config >/dev/null

      - name: Build and start stack
        env:
          LLM_PROVIDER: mock
          BACKEND_HOST_PORT: 19040
          FRONTEND_HOST_PORT: 19041
          MYSQL_HOST_PORT: 19042
        run: |
          docker compose up -d --build --wait --wait-timeout 240

      - name: Smoke probes
        run: |
          set -euo pipefail
          health="$(curl -sf "http://localhost:19040/api/health")"
          echo "$health" | grep -q '"provider":"mock"'
          echo "$health" | grep -q '"status":"UP"'
          curl -sf -o /dev/null "http://localhost:19041/"
          tables="$(docker compose exec -T mysql mysql -ucsagent -pcsagentpwd -P19042 ai_service_agent -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='ai_service_agent';")"
          test "$tables" = "15"
          docker compose exec -T mysql mysql -ucsagent -pcsagentpwd -P19042 ai_service_agent -N -e "SELECT COUNT(*) FROM tool_execution;" >/dev/null
          echo "Docker smoke PASSED (mock LLM, 19040/19041/19042)"

      - name: Core API acceptance
        env:
          BASE_URL: http://127.0.0.1:19041
        run: node scripts/acceptance-smoke.mjs

      - name: k6 read smoke (host port)
        run: |
          docker run --rm \
            -e BASE_URL=http://host.docker.internal:19040 \
            -e VUS=10 \
            -e DURATION=20s \
            -e THINK_TIME_SECONDS=0.2 \
            -v "${{ github.workspace }}/performance:/scripts" \
            --add-host=host.docker.internal:host-gateway \
            grafana/k6:latest run /scripts/k6-smoke.js

      - name: k6 SSE chat soak (Mock LLM)
        run: |
          docker run --rm \
            -e BASE_URL=http://host.docker.internal:19040 \
            -e VUS=3 \
            -e DURATION=15s \
            -e THINK_TIME_SECONDS=1 \
            -v "${{ github.workspace }}/performance:/scripts" \
            --add-host=host.docker.internal:host-gateway \
            grafana/k6:latest run /scripts/k6-sse-chat-soak.js

      - name: k6 core write smoke
        run: |
          docker run --rm \
            -e BASE_URL=http://host.docker.internal:19040 \
            -e VUS=3 \
            -e DURATION=20s \
            -e THINK_TIME_SECONDS=0.2 \
            -v "${{ github.workspace }}/performance:/scripts" \
            --add-host=host.docker.internal:host-gateway \
            grafana/k6:latest run /scripts/k6-write-smoke.js

      - name: Tear down
        if: always()
        run: docker compose down -v
