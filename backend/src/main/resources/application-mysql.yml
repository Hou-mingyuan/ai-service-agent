spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:19042/ai_service_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DATABASE_USERNAME:csagent}
    password: ${DATABASE_PASSWORD:csagentpwd}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      # DDL 失败必须阻止启动，避免部分表缺失后仍被误判为健康。
      continue-on-error: false
  h2:
    console:
      enabled: false
