spring:
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/ai_service_agent?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DATABASE_USERNAME:csagent}
    password: ${DATABASE_PASSWORD:csagentpwd}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      # MySQL 首次启动可能与容器就绪存在竞态，建表使用 IF NOT EXISTS，允许容错继续
      continue-on-error: true
  h2:
    console:
      enabled: false
